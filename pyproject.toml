[project]
name = "spyvar"
version = "0.1.0"
description = "SPY one-day-ahead VaR forecasting mini-project: zero-leakage rolling evaluation of historical simulation, GARCH-t, linear/HAR quantile regression, and small neural quantile models."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=14,<20",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "arch>=6.0,<8",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "matplotlib>=3.8,<4",
    "PyYAML>=6.0,<7",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "slow: long-running integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
